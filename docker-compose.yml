version: '3.8'

services:
  # ── Message Broker ──────────────────────────────────────
  zookeeper:
    image: confluentinc/cp-zookeeper:7.6.0
    container_name: alphawatch-zookeeper
    environment:
      ZOOKEEPER_CLIENT_PORT: 2181
      ZOOKEEPER_TICK_TIME: 2000
    ports:
      - "2181:2181"
    healthcheck:
      test: ["CMD-SHELL", "echo ruok | nc localhost 2181 | grep imok"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - alphawatch-net

  kafka:
    image: confluentinc/cp-kafka:7.6.0
    container_name: alphawatch-kafka
    depends_on:
      zookeeper:
        condition: service_healthy
    ports:
      - "9092:9092"
      - "29092:29092"
    environment:
      KAFKA_BROKER_ID: 1
      KAFKA_ZOOKEEPER_CONNECT: zookeeper:2181
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://kafka:9092,PLAINTEXT_HOST://localhost:29092
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: PLAINTEXT:PLAINTEXT,PLAINTEXT_HOST:PLAINTEXT
      KAFKA_INTER_BROKER_LISTENER_NAME: PLAINTEXT
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_AUTO_CREATE_TOPICS_ENABLE: "true"
    healthcheck:
      test: ["CMD-SHELL", "kafka-broker-api-versions --bootstrap-server localhost:9092 > /dev/null 2>&1"]
      interval: 15s
      timeout: 10s
      retries: 10
      start_period: 30s
    networks:
      - alphawatch-net

  # ── Cache / Coordination ────────────────────────────────
  redis:
    image: redis:7-alpine
    container_name: alphawatch-redis
    ports:
      - "6379:6379"
    command: redis-server --appendonly yes
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
    volumes:
      - redis-data:/data
    networks:
      - alphawatch-net

  # ── Database ────────────────────────────────────────────
  mongodb:
    image: mongo:7
    container_name: alphawatch-mongodb
    ports:
      - "27017:27017"
    healthcheck:
      test: ["CMD", "mongosh", "--eval", "db.runCommand('ping').ok", "--quiet"]
      interval: 10s
      timeout: 5s
      retries: 5
    volumes:
      - mongo-data:/data/db
      - ./db/mongo-init:/docker-entrypoint-initdb.d:ro
    networks:
      - alphawatch-net

  # ── API Gateway ─────────────────────────────────────────
  api-gateway:
    build:
      context: ./api-gateway
      dockerfile: Dockerfile
    container_name: alphawatch-api
    ports:
      - "3001:3001"
    depends_on:
      kafka:
        condition: service_healthy
      redis:
        condition: service_healthy
      mongodb:
        condition: service_healthy
    environment:
      - NODE_ENV=${NODE_ENV:-development}
      - API_PORT=3001
      - KAFKA_BOOTSTRAP_SERVERS=kafka:9092
      - KAFKA_CLIENT_ID=alphawatch-api
      - REDIS_URL=redis://redis:6379
      - MONGODB_URI=mongodb://mongodb:27017/alphawatch
      - NEWSAPI_KEY=${NEWSAPI_KEY}
      - RSS_FETCH_INTERVAL_MS=${RSS_FETCH_INTERVAL_MS:-60000}
      - NEWSAPI_FETCH_INTERVAL_MS=${NEWSAPI_FETCH_INTERVAL_MS:-120000}
      - DEDUP_TTL_SECONDS=${DEDUP_TTL_SECONDS:-86400}
      - NEWSAPI_RATE_LIMIT=${NEWSAPI_RATE_LIMIT:-100}
      - NEWSAPI_RATE_WINDOW_SECONDS=${NEWSAPI_RATE_WINDOW_SECONDS:-86400}
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:3001/api/health || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 10s
    restart: unless-stopped
    networks:
      - alphawatch-net

  # ── Agent Worker (Day 2) ────────────────────────────────
  # agent-worker:
